name: Build Boards

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nt26:
    name: Build ESP32-C3 bread-compact-nt26
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py boards/bread-compact-wifi/bread-compact-nt26 --name bread-compact-nt26

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-nt26
          path: build/merged-binary.bin
          if-no-files-found: error
